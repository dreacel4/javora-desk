<!-- Supabase Auth → Email Templates → Invite user.
     The link uses token_hash so it works with server-side rendering (see docs/SETUP_AND_DEPLOYMENT.md). -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f8fa;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e5e8ee;border-radius:14px;">
      <tr><td style="background:#101c32;border-radius:14px 14px 0 0;padding:20px 28px;color:#ffffff;font-size:14px;letter-spacing:3px;font-weight:600;">JAVORA <span style="color:#7d93b5;font-size:11px;letter-spacing:4px;">DESK</span></td></tr>
      <tr><td style="padding:28px;color:#172033;">
        <h1 style="margin:0 0 12px;font-size:20px;">You're invited to JAVORA DESK</h1>
        <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#4a5568;">You have been invited to join the Javora editing production workspace. Click below to set your password and activate your account.</p>
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite" style="display:inline-block;background:#101c32;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 20px;border-radius:8px;">Accept invitation</a>
        <p style="margin:24px 0 0;font-size:12px;color:#718096;">This link can be used once and expires. Private workspace — access by invitation only.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
